# The check that runs on every push. Deliberately cheap: the expensive
# universal build and the notary round-trip belong to `release.yml`, which only
# runs on a tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The e2e suite opens a real gpui window through the test harness, so this
    # needs a macOS runner rather than the cheaper ubuntu one.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      # Advisory, not blocking. The tree does not currently satisfy either, and
      # turning them red on every push would just train people to ignore CI.
      # Drop the `continue-on-error` once `cargo fmt --all` and the clippy
      # backlog have been dealt with in their own commit.
      - name: Format (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings
