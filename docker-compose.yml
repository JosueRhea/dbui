# Servers for the live driver tests.
#
#   docker compose up -d
#   DBUI_LIVE_TESTS=1 cargo test -p dbui-driver
#
# Also the quickest way to have something to point the app at: add a connection
# to 127.0.0.1 with user/password below.
#
# Non-default ports so this never collides with a Postgres or MySQL already
# running on the machine. `crates/dbui-driver/tests/live.rs` reads the same
# values, and both can be overridden with DBUI_PG_* / DBUI_MYSQL_* env vars.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: dbui
      POSTGRES_DB: dbui_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbui_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dbui
      MYSQL_DATABASE: dbui_test
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdbui"]
      interval: 2s
      timeout: 3s
      retries: 30
