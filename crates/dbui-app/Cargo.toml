[package]
name = "dbui-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application layer: workspace state, use cases, and the tokio bridge."

# No gpui here. This crate must stay runnable from a test or a CLI, which is
# what keeps the use cases free of rendering concerns.
[dependencies]
dbui-domain = { workspace = true }
dbui-driver = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
plist = { workspace = true }
# The updater talks to the GitHub releases API. rustls rather than native-tls
# so the release build does not depend on the host's OpenSSL -- the same reason
# sqlx is built with `tls-rustls-ring`.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
    "http2",
] }
sha2 = "0.10"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[dev-dependencies]
# The updater's live tests drive async code directly.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The use-case tests stand a fake driver in for a server, which means
# implementing the port's async trait.
async-trait = { workspace = true }
